<header id="hdr" class="auth-header scrolled">
  <a href="/" class="auth-logo">
    <img src="LogoADTrainer-removebg-preview.png" alt="ADtrainer Shop" class="auth-logo-img" />
  </a>

  <nav class="auth-nav">
    <a href="/" class="auth-nav-link">{{ 'nav.overview' | t }}</a>
    <a href="/gallery" class="auth-nav-link">{{ 'nav.gallery' | t }}</a>
    <a href="/infos" class="auth-nav-link">{{ 'nav.infos' | t }}</a>
  </nav>

  <a href="/login" class="auth-account-btn">{{ 'header.account' | t }}</a>
</header>

<main class="auth-page">
  <section class="auth-panel auth-panel-wide">
    <p class="auth-kicker">{{ 'auth.register.kicker' | t }}</p>
    <h1>{{ 'auth.register.title' | t }}</h1>
    <p class="auth-copy">{{ 'auth.register.copy' | t }}</p>

    <form class="auth-form auth-grid-form" #registerForm (submit)="$event.preventDefault(); register(registerForm)">
      <label>
        <span>{{ 'auth.register.firstName' | t }}</span>
        <input type="text" name="firstName" autocomplete="given-name" placeholder="....." required />
      </label>

      <label>
        <span>{{ 'auth.register.lastName' | t }}</span>
        <input type="text" name="lastName" autocomplete="family-name" placeholder="......" required />
      </label>

      <label>
        <span>{{ 'auth.register.email' | t }}</span>
        <input type="email" name="email" autocomplete="email" placeholder="you@example.com" required />
      </label>

      <label>
        <span>{{ 'auth.register.phone' | t }} <span class="auth-optional">{{ 'auth.register.phoneOptional' | t }}</span></span>
        <input type="tel" name="phone" autocomplete="tel" placeholder="+33 6 12 34 56 78" />
      </label>

      <label class="auth-full">
        <span>{{ 'auth.register.password' | t }}</span>
        <div class="auth-pw-wrap">
          <input [type]="showPassword ? 'text' : 'password'" name="password" autocomplete="new-password" placeholder="••••••••" required />
          <button type="button" class="auth-pw-toggle" (click)="togglePassword()" [attr.aria-label]="showPassword ? ('auth.login.hide' | t) : ('auth.login.show' | t)">
            <svg *ngIf="!showPassword" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
            <svg *ngIf="showPassword" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94"/>
              <path d="M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19"/>
              <line x1="1" y1="1" x2="23" y2="23"/>
            </svg>
          </button>
        </div>
      </label>

      <p *ngIf="errorMessage" class="auth-error auth-full">{{ errorMessage }}</p>
      <button type="submit" class="auth-full" [disabled]="isLoading">{{ isLoading ? ('auth.register.loading' | t) : ('auth.register.submit' | t) }}</button>
    </form>

    <p class="auth-switch">{{ 'auth.register.hasAccount' | t }} <a href="/login">{{ 'auth.register.login' | t }}</a></p>
  </section>
</main>
