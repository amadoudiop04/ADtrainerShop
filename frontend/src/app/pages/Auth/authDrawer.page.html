<!-- Backdrop overlay -->
<div
  *ngIf="drawerService.isOpen()"
  class="ad-overlay"
  (click)="drawerService.close()"
></div>

<!-- Sliding panel -->
<aside
  class="ad-drawer"
  [class.ad-drawer--open]="drawerService.isOpen()"
  role="dialog"
  [attr.aria-modal]="drawerService.isOpen()"
  aria-label="Authentification"
  (mouseleave)="onMouseLeave()"
  (mouseenter)="onMouseEnter()"
>
  <div class="ad-top-bar">
    <button type="button" class="ad-close" (click)="drawerService.close()" aria-label="Fermer">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <line x1="18" y1="6" x2="6" y2="18"/>
        <line x1="6" y1="6" x2="18" y2="18"/>
      </svg>
    </button>
  </div>

  <div class="ad-scroll-area">

    <!-- ── LOGIN ──────────────────────────────────── -->
    <div *ngIf="drawerService.mode() === 'login'" class="ad-pane">
      <p class="ad-kicker">{{ 'auth.login.kicker' | t }}</p>
      <h2 class="ad-title">{{ 'auth.login.title' | t }}</h2>
      <p class="ad-copy">{{ 'auth.login.copy' | t }}</p>

      <form class="ad-form" #loginForm (submit)="$event.preventDefault(); login(loginForm)">
        <label>
          <span>{{ 'auth.login.email' | t }}</span>
          <input type="email" name="email" autocomplete="email" placeholder="you@example.com" required />
        </label>

        <label>
          <span>{{ 'auth.login.password' | t }}</span>
          <div class="ad-pw-wrap">
            <input
              [type]="showPassword ? 'text' : 'password'"
              name="password"
              autocomplete="current-password"
              placeholder="••••••••"
              required
            />
            <button
              type="button"
              class="ad-pw-btn"
              (click)="togglePassword()"
              [attr.aria-label]="showPassword ? ('auth.login.hide' | t) : ('auth.login.show' | t)"
            >
              <svg *ngIf="!showPassword" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
              <svg *ngIf="showPassword" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94"/>
                <path d="M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19"/>
                <line x1="1" y1="1" x2="23" y2="23"/>
              </svg>
            </button>
          </div>
        </label>

        <p *ngIf="errorMessage" class="ad-error">{{ errorMessage }}</p>

        <button type="submit" class="ad-submit" [disabled]="isLoading">
          {{ isLoading ? ('auth.login.loading' | t) : ('auth.login.submit' | t) }}
        </button>
      </form>

      <p class="ad-switch">
        {{ 'auth.login.noAccount' | t }}
        <button type="button" class="ad-switch-btn" (click)="switchMode('register')">{{ 'auth.login.createAccount' | t }}</button>
      </p>
    </div>

    <!-- ── REGISTER ────────────────────────────────── -->
    <div *ngIf="drawerService.mode() === 'register'" class="ad-pane">
      <p class="ad-kicker">{{ 'auth.register.kicker' | t }}</p>
      <h2 class="ad-title">{{ 'auth.register.title' | t }}</h2>
      <p class="ad-copy">{{ 'auth.register.copy' | t }}</p>

      <form class="ad-form" #registerForm (submit)="$event.preventDefault(); register(registerForm)">
        <label>
          <span>{{ 'auth.register.firstName' | t }}</span>
          <input type="text" name="firstName" autocomplete="given-name" placeholder="......" required />
        </label>

        <label>
          <span>{{ 'auth.register.lastName' | t }}</span>
          <input type="text" name="lastName" autocomplete="family-name" placeholder="......" required />
        </label>

        <label>
          <span>{{ 'auth.register.email' | t }}</span>
          <input type="email" name="email" autocomplete="email" placeholder="you@example.com" required />
        </label>

        <label>
          <span>{{ 'auth.register.phone' | t }} <em class="ad-optional">{{ 'auth.register.phoneOptional' | t }}</em></span>
          <input type="tel" name="phone" autocomplete="tel" placeholder="+33 6 12 34 56 78" />
        </label>

        <label>
          <span>{{ 'auth.register.password' | t }}</span>
          <div class="ad-pw-wrap">
            <input
              [type]="showPassword ? 'text' : 'password'"
              name="password"
              autocomplete="new-password"
              placeholder="••••••••"
              required
            />
            <button
              type="button"
              class="ad-pw-btn"
              (click)="togglePassword()"
              [attr.aria-label]="showPassword ? ('auth.login.hide' | t) : ('auth.login.show' | t)"
            >
              <svg *ngIf="!showPassword" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
              <svg *ngIf="showPassword" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94"/>
                <path d="M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19"/>
                <line x1="1" y1="1" x2="23" y2="23"/>
              </svg>
            </button>
          </div>
        </label>

        <p *ngIf="errorMessage" class="ad-error">{{ errorMessage }}</p>

        <button type="submit" class="ad-submit" [disabled]="isLoading">
          {{ isLoading ? ('auth.register.loading' | t) : ('auth.register.submit' | t) }}
        </button>
      </form>

      <p class="ad-switch">
        {{ 'auth.register.hasAccount' | t }}
        <button type="button" class="ad-switch-btn" (click)="switchMode('login')">{{ 'auth.register.login' | t }}</button>
      </p>
    </div>

  </div><!-- /ad-scroll-area -->
</aside>
